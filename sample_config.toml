[spreadsheet]
sheet_pattern = "^\\d{1,2}/\\d{4}$"  # matches "3/2026", "12/2025", etc.

[simplefin.accounts]
# Map each SimpleFIN account id to the display name used by the budget app.
# First run `budget simplefin --list-raw-ids`, then paste a listed ID here.
"replace-with-simplefin-account-id" = "Josh's Schwab Savings"
 
# Define the cells you care about as label = "CellRef"
# You can organize them into any sections you like.
# Cell references use standard A1 notation (e.g. "B3", "C12").
 
[cells.income]
salary = "B3"
freelance = "B4"
 
[cells.expenses]
rent = "C7"
groceries = "C10"
utilities = "C11"
transport = "C12"

[summary.gross_income]
section = "income"
label   = "salary"

[summary.total_expenses]
section = "expenses"
label   = "rent"

[summary.net_income]
derived = "gross_income - total_expenses"

[summary.disposable]
derived = "net_income - total_expenses"
