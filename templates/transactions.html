<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transactions</title><style>body{font:16px system-ui;max-width:1100px;margin:2rem auto;padding:0 1rem}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:.6rem;border-bottom:1px solid #ddd}</style></head><body><a href="/">Budget</a> · <a href="/rules">Categories &amp; Rules</a><h1>Transactions</h1><table><thead><tr><th>Date</th><th>Account</th><th>Description</th><th>Amount</th><th>Category</th></tr></thead><tbody>{% for row in transactions.itertuples(index=false, name=None) %}<tr><td>{{ row[0] or '' }}</td><td>{{ row[1] }}</td><td><a href="{{ url_for('rules', description=row[3]) }}">{{ row[3] }}</a></td><td>{{ '%.2f'|format(row[2]) }}</td><td>{{ row[7] or '—' }}</td></tr>{% else %}<tr><td colspan="5">No transactions saved.</td></tr>{% endfor %}</tbody></table></body></html>
